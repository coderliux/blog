<style>
  .site-header .wrapper { display: flex; align-items: center; }
  .site-actions { display: flex; align-items: center; gap: .25rem; margin-left: auto; }
  .site-action { display: inline-flex; align-items: center; padding: .3rem; color: #57606a; text-decoration: none; border: 0; background: transparent; cursor: pointer; border-radius: 6px; }
  .site-action:hover { color: #0969da; background: rgba(9, 105, 218, .08); }
  .site-action svg { display: block; }
  .star-count { font-size: .8rem; line-height: 1; margin-left: .2rem; color: #57606a; }

<script>
(function () {
  var count = document.getElementById('star-count');
  if (!count) return;
  fetch('https://api.github.com/repos/coderliux/blog')
    .then(function (res) { return res.json(); })
    .then(function (d) {
      if (d && typeof d.stargazers_count === 'number') {
        count.textContent = d.stargazers_count;
      }
    })
    .catch(function () {});
})();
</script>
