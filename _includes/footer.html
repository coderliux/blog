<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-back-to-top">
      <button type="button" class="back-to-top" id="back-to-top">返回顶部</button>
    </div>
  </div>

</footer>

<style>
  .footer-back-to-top { text-align: center; padding: 1rem 0; }
  .back-to-top {
    padding: .45rem 1.2rem;
    background: #0969da;
    color: #fff;
    border: 0;
    border-radius: 6px;
    font-size: .85rem;
    cursor: pointer;
  }
  .back-to-top:hover { background: #0550ae; }
</style>

<script>
(function () {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
